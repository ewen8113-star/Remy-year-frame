<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <title>注册 - 人头马年框项目管理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/base.css?v=20260727-base-css">
  <link rel="stylesheet" href="styles/components.css?v=20260727-components-css">
  <link rel="stylesheet" href="styles/auth.css?v=20260727-auth-css">
</head>
<body class="auth-page-body">
  <main class="auth-page-shell">
    <div class="auth-glass-card">
      <div class="card-title">创建账号</div>
      <div class="card-sub">新账号默认角色为 operator，登录后可登记报销</div>
      <form id="registerForm" onsubmit="submitRegister(event)">
        <div class="form-group" style="margin-bottom:12px;">
          <label class="form-label">用户名</label>
          <input class="form-control" id="regUsername" autocomplete="username" required>
        </div>
        <div class="form-group" style="margin-bottom:12px;">
          <label class="form-label">密码</label>
          <input class="form-control" id="regPassword" type="password" autocomplete="new-password" required>
        </div>
        <div class="form-group" style="margin-bottom:16px;">
          <label class="form-label">确认密码</label>
          <input class="form-control" id="regConfirmPassword" type="password" autocomplete="new-password" required>
        </div>
        <div id="registerError" style="display:none;margin-bottom:12px;color:#ef4444;font-size:13px;"></div>
        <button class="btn btn-primary" id="registerBtn" type="submit" style="width:100%;">注册</button>
        <div style="margin-top:12px;text-align:center;font-size:13px;color:#64748b;">
          已有账号？
          <a href="/login.html">去登录</a>
        </div>
      </form>
    </div>
  </main>
  <script src="disable-number-input-wheel.js?v=2"></script>
  <script src="register.js?v=20260419ui-spec"></script>
</body>
</html>
